<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos</title>
</head>
<body>
    <!-- Creamos el titulo de la pagina -->
    <h1>Encabezado Principal</h1>
    <p>Este es un párrafo de texto simple.</p>

    <!-- Creamos lineas divisoras -->
    <hr>

    <!-- Creamos subtitulos con su contenido -->
    <h2>encabezado Secundario</h2>
    <!-- Creamos bloque de cita para fragmentos extensos -->
    <blockquote>Este es un bloque de cita.</blockquote>

    <h3>Encabezado Terciario</h3>
    <!-- Creamos texto preformateado, mantiene el formato tal cual -->
    <pre>       Este es un bloque de texto preformateado.
       Puedes colocar aquí código o texto con formato especial.
    </pre>
</body>
</html>
