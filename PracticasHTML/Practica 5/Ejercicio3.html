<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form HTML5</title>
</head>
<body>
    <h1>Formulario de registro</h1>
    <form action="" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required autofocus><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" required><br><br>

        <label for="url">URL:</label>
        <input type="url" id="url" placeholder="Escribe la URL"><br><br>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha"><br><br>

        <label for="hora">Hora:</label>
        <input type="time" id="hora"><br><br>

        <label for="fechaEntera">Fecha y hora:</label>
        <input type="datetime-local" id="fechaEntera"><br><br>

        <label for="mes">Mes:</label>
        <input type="month" id="mes"><br><br>

        <label for="semana">Semana:</label>
        <input type="week" id="semana"><br><br>

        <label for="numero">Número (entre -10 y 10):</label>
        <input type="number" id="numero" min="-10" max="10"><br><br>

        <label for="tlf">Teléfono:</label>
        <input type="tel" id="tlf"><br><br>

        <label for="busca">Término de búsqueda:</label>
        <input type="search"><br><br>

        <label for="color">Color favorito:</label>
        <input type="color"><br><br>

        <input type="submit">
    </form>
</body>
</html>
