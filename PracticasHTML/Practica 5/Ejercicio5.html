<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animales</title>
</head>
<body>
    <header>
        <h1>Animales</h1>
    </header>

    <main>
        <section>
            <figure>
                <figcaption><b>Capibara / Capybara</b></figcaption>
                <img src="imgs/capybara.png" alt="Capibara Animal" width="400" height="400"> <br>
                <audio src="audios/capybara.mp3" controls></audio>
            </figure>
        </section> <br>

        <section>
            <figure>
                <figcaption><b>Gato</b></figcaption>
                <img src="imgs/gato.jpg" alt="" width="400" height="400"> <br>
                <audio src="audios/gatos.mp3" controls></audio>
            </figure>
        </section> <br>

        <section>
            <figure>
                <figcaption><b>Perro</b></figcaption>
                <img src="imgs/dog.jpg" alt="" width="400" height="400"> <br>
                <audio src="audios/dog.mp3" controls></audio>
            </figure>
        </section> <br>

        <section>
            <figure>
                <figcaption><b>Pavo Real</b></figcaption>
                <img src="imgs/pavoReal.jpg" alt="" width="400" height="400"> <br>
                <audio controls>
                    <source src="audios/pavoReal.mp3" type="audio/mp3">
                </audio>
            </figure>
        </section>
    </main>
</body>
</html>
