<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figuras</title>
  </head>
  <body>
    <header>
      <h1>Cuadros famosos</h1>
      <nav>
        <a href="#1">1</a> | <a href="#2">2</a> | <a href="#3">3</a> |
        <a href="#4">4</a> |
        <a href="#5">5</a>
      </nav>
      <br />
      <hr />
    </header>

    <main>
      <section>
        <figure id="1">
          <img src="imgs/VignesCampo.jpg" alt="Vineyards Campo" width="400" />
          <figcaption>
            Vineyards (AOC Languedoc-Cabrières) in autumn at the foot of the Pic
            de Vissou.<br />
            Commune of Cabrières, Hérault, France.
          </figcaption>
        </figure>
      </section>
      <br />

      <section>
        <figure id="2">
          <img src="imgs/PipePiano.jpg" alt="Pipe Piano" width="400" />
          <figcaption>
            Keyboard of pipe organ of choir in Saint-Martin church in Colmar
            (Haut-Rhin, France).
          </figcaption>
        </figure>
      </section>
      <br />

      <section>
        <figure id="3">
          <img src="imgs/HouseUkraine.jpg" alt="Ukraine House" width="400" />
          <figcaption>
            House of Culture in the village of Lishchynivka, Ukraine
          </figcaption>
        </figure>
      </section>
      <br />

      <section>
        <figure id="4">
          <img
            src="imgs/ViruLake.jpg"
            alt="Viru Lake landscape"
            width="400"
            height="400"
          />
          <figcaption>Viru bog, Lahemaa National Park, Estonia</figcaption>
        </figure>
      </section>
      <br />

      <section>
        <figure id="5">
          <img src="imgs/WoodForest.jpg" alt="Wood Forest" width="400" />
          <figcaption>Bluebells in Pryor's Wood, Stevenage.</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
