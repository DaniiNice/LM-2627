<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boceto HTML5</title>
    <style>
        header {
            background-color: rgb(1, 162, 162);
        }
        nav {
            background-color: rgb(169, 159, 146);
        }
        main {
            background-color: rgb(205, 178, 145);
        }
        section {
            background-color: brown;
        }
        footer {
            background-color: darkolivegreen;
        }
        article {
            background-color: rgb(76, 114, 184);
        }
    </style>
</head>
<body>
    <!--Cabecera-->
    <header>
        <h1>header</h1>
        <!--Navegacion, recomendable tenerlo dentro de cabecera-->
        <nav>nav</nav>
    </header>

    <!--Cuerpo-->
    <main>
        <!--Seccion 1-->
        <section>
            <h1>Section 1</h1>
        </section>

        <!--Seccion 2-->
        <section>
            <div>
                <video src="" height="30"></video>
            </div>
            <!--Articulo 1-->
            <article>
                <div>
                    <img src="" alt="articulo1">
                </div>
            </article>
        </section>

        <!--Seccion 3-->
        <section>
            <!--Articulo 2-->
            <article>
                <img src="" alt="foto articulo2">
            </article>
            <div>
                <video src="" height="30"></video>
            </div>
        </section>
    </main>

    <!--Pie de pagina-->
    <footer>
        <!--Seccion 4-->
        <section>
            <p>Seccion 4</p>
        </section>

        <!--Seccion 5-->
        <section>
            <ul>
                <li>Seccion 5</li>
            </ul>
        </section>

        <!--Seccion 6-->
        <section>
            <img src="" alt="foto section6">
        </section>
    </footer>
</body>
</html>
