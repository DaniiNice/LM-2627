<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario Escolar 2026/27</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: sans-serif;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        #recreo {
            background-color: #eaeaea;
            font-weight: bold;
        }
        ul {
            font-family: sans-serif;
            list-style-type: none;
            padding-left: 0;
        }
        li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<table>
    <thead>
        <tr>
            <th>2026/27</th>
            <th>LUNES</th>
            <th>MARTES</th>
            <th>MIÉRCOLES</th>
            <th>JUEVES</th>
            <th>VIERNES</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><b>08:00 – 09:00</b></td>
            <td>ED</td>
            <td rowspan="2">PROG</td>
            <td rowspan="3">SSII</td>
            <td rowspan="2">LM</td>
            <td>IPE</td>
        </tr>
        <tr>
            <td><b>09:00 – 10:00</b></td>
            <td rowspan="2">BD</td>
            <td rowspan="2">BD</td>
        </tr>
        <tr>
            <td><b>10:00 – 11:00</b></td>
            <td>LM</td>
            <td>PROG</td>
        </tr>
        <tr>
            <td><b>11:00 – 11:30</b></td>
            <td colspan="5" id="recreo">RECREO</td>
        </tr>
        <tr>
            <td><b>11:30 – 12:30</b></td>
            <td>TUTO</td>
            <td>IPE</td>
            <td rowspan="2">PROG</td>
            <td>PROG</td>
            <td>SOST</td>
        </tr>
        <tr>
            <td><b>12:30 – 13:30</b></td>
            <td rowspan="2">PROG</td>
            <td rowspan="2">ED</td>
            <td rowspan="2">BD</td>
            <td rowspan="2">SSII</td>
        </tr>
        <tr>
            <td><b>13:30 – 14:30</b></td>
            <td>IPE</td>
        </tr>
    </tbody>
</table>
</body>
</html>
