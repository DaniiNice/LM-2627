<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Etiquetas HTML</title>
    <style>
        table {
            border: 4px double black;
            border-spacing: 2px;
        }
        th, td {
            border: 1px solid #767676;
            padding: 2px 5px;
        }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th>Categoria</th>
            <th>Etiquetas</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="5" align="center"><b>Formulario</b></td>
            <td>form</td>
        </tr>
        <tr><td>button</td></tr>
        <tr><td>input</td></tr>
        <tr><td>select</td></tr>
        <tr><td>textarea</td></tr>

        <tr>
            <td rowspan="5" align="center"><b>Tabla</b></td>
            <td>table</td>
        </tr>
        <tr><td>tr</td></tr>
        <tr><td>th</td></tr>
        <tr><td>td</td></tr>
        <tr><td>caption</td></tr>

        <tr>
            <td rowspan="6" align="center"><b>Texto</b></td>
            <td>b</td>
        </tr>
        <tr><td>em</td></tr>
        <tr><td>i</td></tr>
        <tr><td>strong</td></tr>
        <tr><td>sub</td></tr>
        <tr><td>sup</td></tr>
    </tbody>
</table>

</body>
</html>
