<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de registro</title>
  </head>
  <body>
    <h1>Formulario de registro</h1>
    <form>
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" />
      </p>

      <p>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" />
      </p>

      <p>
        Sexo:
        <input type="radio" id="hombre" name="sexo" value="hombre" />
        <label for="hombre">hombre</label>
        <input type="radio" id="mujer" name="sexo" value="mujer" checked />
        <label for="mujer">mujer</label>
      </p>

      <p>
        <label for="correo">Correo:</label>
        <input type="text" id="correo" name="correo" />
      </p>

      <p>
        <label for="poblacion">Población:</label>
        <select id="poblacion" name="poblacion">
          <option value="alicante">Alicante</option>
          <option value="malaga">Malaga</option>
          <option value="sevilla">Sevilla</option>
        </select>
      </p>

      <p>
        <label for="descripcion">Descripción:</label>
        <textarea
          id="descripcion"
          name="descripcion"
          rows="5"
          cols="40"
        ></textarea>
      </p>

      <p>
        <input type="checkbox" id="novedades" name="novedades" />
        <label for="novedades"
          >Deseo recibir información sobre novedades y ofertas</label
        >
      </p>

      <p>
        <input type="checkbox" id="condiciones" name="condiciones" />
        <label for="condiciones"
          >Declaro haber leído y aceptar las condiciones generales del programa
          y la normativa sobre protección de datos</label
        >
      </p>

      <p>
        <input type="submit" value="Enviar" />
      </p>
    </form>
  </body>
</html>
