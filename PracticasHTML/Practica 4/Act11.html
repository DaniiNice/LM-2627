<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con estilo sin CSS</title>
    <style>
        select {
            width: 100%;
        }
    </style>
</head>
<body>
    <table bgcolor="#9cbdff" width="450" cellpadding="20" cellspacing="0" border="0">
    <tr>
        <td>
        <form action="#" method="post">
            <p>
            <b>Nombre:</b><br>
            <input type="text" name="nombre" placeholder="Escribe tu nombre" size="50">
            </p>
            
            <p>
            <b>Email:</b><br>
            <input type="email" name="email" placeholder="correo@empresa.com" size="50">
            </p>
            
            <p>
            <b>Asunto</b><br>
            <select name="asunto" size="3">
                <option value="presupuesto">Pedir presupuesto web</option>
                <option value="cita">Solicitar cita previa</option>
                <option value="otros">Otros</option>
            </select>
            </p>
            
            <p>
            <b>¿Cómo nos ha conocido?</b><br>
            <input type="checkbox" name="origen" value="amigo"> Un amigo
            <input type="checkbox" name="origen" value="google"> Googleando
            <input type="checkbox" name="origen" value="buzoneo"> Buzoneo
            <input type="checkbox" name="origen" value="otros"> Otros
            </p>
            
            <p>
            <b>Escribe tu mensaje</b><br>
            <textarea name="mensaje" rows="6" cols="50"></textarea>
            </p>
            
            <p>
            <input type="checkbox" name="privacidad" required>
            He leído y acepto el <a href="#">aviso legal</a> y la <a href="#">política de privacidad</a>.
            </p>
        </form>
        </td>
    </tr>
    </table>
</body>
</html>
