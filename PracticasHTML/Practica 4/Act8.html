<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificar incidencia</title>
</head>
<body>
    <form method="post">
        <fieldset>
            <legend>Datos de la incidencia:</legend>
            <label for="usuario">Usuario:</label><br>
            <input type="text" id="usuario"><br><br>

            <label for="departamento">Departamento:</label><br>
            <select id="departamento">
                <option value="1">Informatica</option>
                <option value="2">Sistemas</option>
                <option value="3">Contable</option>
            </select><br><br>

            <label for="desc">Descripción:</label><br>
            <textarea id="desc" rows="4" cols="50">Describa la incidencia...</textarea><br><br>

            <label for="contra">Contraseña</label><br>
            <input type="password">
        </fieldset>
        <fieldset>
            <legend>Botones de reset y envío:</legend>
            <input type="reset" value="Resetear">
            <input type="submit">
        </fieldset>
    </form>
</body>
</html>
