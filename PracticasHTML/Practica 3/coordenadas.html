<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenadas</title>
</head>
<body>
    <!-- Usar usemap apuntando al id del mapa -->
    <img src="imgs/F.png" usemap="#mapa-regiones" alt="Mapa interactivo">

    <map name="mapa-regiones">
        <!-- Área Magenta -->
        <area shape="rect" coords="205,183,249,397" href="https://diariodesevilla.es" alt="Diario de Sevilla" target="_blank">
 
        <!-- Área Verde -->
        <area shape="rect" coords="249,182,421,229" href="https://juntadeandalucia.es" alt="Junta de Andalucía" target="_blank">
 
        <!-- Área Celeste -->
        <area shape="rect" coords="250,268,420,313" href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" alt="Centro" target="_blank">
    </map>
</body>
</html>
